# Senate block (owner, October 13, 2026): the seats on the ballot on November 3, 2026 and the party that holds
# each now, and the seats not on the ballot by party. Class II (33 seats) from the Senate's list; the special
# elections for the Class III seats of Florida (Rubio) and Ohio (Vance), held by appointees. Party division
# 53 R, 45 D, 2 independents who caucus with the Democrats (counted as D). The vice president, a Republican,
# breaks a 50-50 tie. Listed with its sources in the Senate section of data/sources.md.
senate_2026:
  checked: 2026-10-17
  sources:
    - https://www.senate.gov/senators/Class_II.htm
    - https://www.senate.gov/senators/Class_III.htm
    - https://www.senate.gov/history/partydiv.htm
